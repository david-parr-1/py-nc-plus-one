repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: run pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
  
  - repo: http://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit-security-check
        args: ["-ll", "--skip", "B101"]
