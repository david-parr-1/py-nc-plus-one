name: py-nc-plus-one Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff Format
        run: ruff format .

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Bandit
        run: |
          bandit -ll -r main.py auth/ db/ src/ terraform/ tests/ --skip B101

      - name: Run Pytest
        run: python -m pytest -v
