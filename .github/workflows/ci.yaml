name: py-nc-plus-one Workflow

on:
  push:
    branches: ["**"] # Includes pushes, excludes tags.
  pull_request:
    branches: ["main"]

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff Format
        run: ruff format .

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Bandit
        run: |
          bandit -ll -r main.py auth/ db/ src/ terraform/ tests/ --skip B101

      - name: Run Pytest
        run: python -m pytest -v

  terraform-validate-and-plan:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416775509218:role/GH-TF-Plan-and-Validate
          aws-region: eu-west-2
          role-session-name: GitHubActionsTerraformSession

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-deploy:
    name: Terraform Apply (Deploy)
    needs: terraform-validate-and-plan
    # Ensures deployment ONLY happens on a push to main (merge event)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416775509218:role/GH-TF-Deploy
          aws-region: eu-west-2
          role-session-name: GitHubActionsTerraformSession

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
